<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudySprint — Focus &amp; Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>StudySprint</h1>
      <p class="tagline">Simple Pomodoro timer &amp; session task tracker</p>
    </header>

    <!-- Mod Seçimi -->
    <section class="card timer-card" aria-label="Pomodoro Timer">
      <div class="mode-tabs" role="tablist">
        <button class="mode-btn active" data-mode="focus" data-minutes="25" type="button">Focus (25m)</button>
        <button class="mode-btn" data-mode="short" data-minutes="5" type="button">Short Break (5m)</button>
        <button class="mode-btn" data-mode="long" data-minutes="15" type="button">Long Break (15m)</button>
      </div>

      <div id="timer-display" class="timer-display" aria-live="polite">25:00</div>

      <div class="controls">
        <button id="start-btn" class="btn primary" type="button">Start</button>
        <button id="pause-btn" class="btn secondary" type="button" disabled>Pause</button>
        <button id="reset-btn" class="btn ghost" type="button">Reset</button>
      </div>

      <!-- Özel Süre Ayarı ve Doğrulama -->
      <form id="custom-form" class="custom-form" novalidate>
        <label for="custom-minutes">Custom minutes (1–180):</label>
        <div class="custom-input-row">
          <input id="custom-minutes" type="number" min="1" max="180" placeholder="e.g. 45">
          <button class="btn ghost" type="submit">Set</button>
        </div>
        <p id="timer-error" class="error-msg" role="alert"></p>
      </form>

      <div class="stats">
        <span>Completed Focus Sessions: <strong id="session-count">0</strong></span>
      </div>
    </section>

    <!-- Görev Listesi -->
    <section class="card tasks-card" aria-label="Session Tasks">
      <h2>Session Tasks</h2>
      <form id="task-form" class="task-form" novalidate>
        <input id="task-input" type="text" maxlength="80" placeholder="What are you studying right now?">
        <button class="btn primary" type="submit">Add</button>
      </form>
      <p id="task-error" class="error-msg" role="alert"></p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
